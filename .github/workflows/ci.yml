name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests and GUI construction
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Build verified release package
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: graph-explorer-token-manager
          path: artifacts/*
          if-no-files-found: error
